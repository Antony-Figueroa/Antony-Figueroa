<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" role="img" aria-labelledby="cityTitle">
  <title id="cityTitle">Contribution City — Ciudad isométrica de contribuciones</title>
  <defs>
    <style>
      .ground { fill: #F0F1F5; }
      .building-1 { fill: #6A0DAD; stroke: #4A0A8B; stroke-width: 1.5; }
      .building-2 { fill: #8E24AA; stroke: #6A0DAD; stroke-width: 1.5; }
      .building-3 { fill: #AB47BC; stroke: #8E24AA; stroke-width: 1.5; }
      .roof-1 { fill: #4A0A8B; }
      .roof-2 { fill: #5E1CA8; }
      .roof-3 { fill: #7B2CBF; }
      .wall-dark { fill: #3A0A6B; opacity: 0.15; }
      .window { fill: #FFFFFF; opacity: 0.7; }
      .window-dark { fill: #2D1B4D; opacity: 0.6; }
      .street { fill: #E8EAF0; }
      .text-label { fill: #6A0DAD; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .text-sub { fill: #8E24AA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Suelo / plataforma isométrica -->
  <polygon points="0,220 250,120 500,220 250,320" class="ground"/>
  <polygon points="0,220 250,120 250,220 0,220" class="street" opacity="0.3"/>

  <!-- ===== EDIFICIO 1 (izquierda, mediano-bajo) ===== -->
  <g transform="translate(60, 200)">
    <!-- Techo -->
    <polygon points="0,0 50,-25 100,0 50,25" class="roof-1"/>
    <!-- Pared izquierda -->
    <polygon points="0,0 50,25 50,55 0,30" class="building-1"/>
    <!-- Pared derecha -->
    <polygon points="100,0 50,25 50,55 100,30" class="building-2"/>
    <!-- Pared frente -->
    <polygon points="0,30 50,55 100,30 100,5 0,5" class="building-3"/>
    <!-- Ventanas frente -->
    <rect x="25" y="12" width="6" height="6" class="window"/>
    <rect x="69" y="12" width="6" height="6" class="window"/>
    <rect x="25" y="22" width="6" height="6" class="window"/>
    <rect x="69" y="22" width="6" height="6" class="window"/>
  </g>

  <!-- ===== EDIFICIO 2 (centro-izquierda, alto) ===== -->
  <g transform="translate(180, 160)">
    <!-- Techo -->
    <polygon points="0,0 60,-30 120,0 60,30" class="roof-2"/>
    <!-- Pared izquierda -->
    <polygon points="0,0 60,30 60,70 0,40" class="building-1"/>
    <!-- Pared derecha -->
    <polygon points="120,0 60,30 60,70 120,40" class="building-2"/>
    <!-- Pared frente -->
    <polygon points="0,40 60,70 120,40 120,10 0,10" class="building-3"/>
    <!-- Ventanas frente -->
    <rect x="30" y="18" width="6" height="6" class="window"/>
    <rect x="84" y="18" width="6" height="6" class="window"/>
    <rect x="30" y="30" width="6" height="6" class="window"/>
    <rect x="84" y="30" width="6" height="6" class="window"/>
    <rect x="30" y="42" width="6" height="6" class="window"/>
    <rect x="84" y="42" width="6" height="6" class="window"/>
  </g>

  <!-- ===== EDIFICIO 3 (centro-derecha, muy alto) ===== -->
  <g transform="translate(320, 140)">
    <!-- Techo -->
    <polygon points="0,0 70,-35 140,0 70,35" class="roof-3"/>
    <!-- Pared izquierda -->
    <polygon points="0,0 70,35 70,85 0,50" class="building-2"/>
    <!-- Pared derecha -->
    <polygon points="140,0 70,35 70,85 140,50" class="building-3"/>
    <!-- Pared frente -->
    <polygon points="0,50 70,85 140,50 140,15 0,15" class="building-1"/>
    <!-- Ventanas frente -->
    <rect x="35" y="22" width="6" height="6" class="window"/>
    <rect x="99" y="22" width="6" height="6" class="window"/>
    <rect x="35" y="36" width="6" height="6" class="window"/>
    <rect x="99" y="36" width="6" height="6" class="window"/>
    <rect x="35" y="50" width="6" height="6" class="window"/>
    <rect x="99" y="50" width="6" height="6" class="window"/>
    <rect x="35" y="64" width="6" height="6" class="window"/>
    <rect x="99" y="64" width="6" height="6" class="window"/>
  </g>

  <!-- ===== EDIFICIO 4 (derecha, bajo) ===== -->
  <g transform="translate(420, 210)">
    <!-- Techo -->
    <polygon points="0,0 40,-20 80,0 40,20" class="roof-1"/>
    <!-- Pared izquierda -->
    <polygon points="0,0 40,20 40,45 0,25" class="building-3"/>
    <!-- Pared derecha -->
    <polygon points="80,0 40,20 40,45 80,25" class="building-1"/>
    <!-- Pared frente -->
    <polygon points="0,25 40,45 80,25 80,5 0,5" class="building-2"/>
    <!-- Ventanas -->
    <rect x="20" y="10" width="6" height="6" class="window"/>
    <rect x="54" y="10" width="6" height="6" class="window"/>
  </g>

  <!-- ===== EDIFICIO 5 (centro, mediano) ===== -->
  <g transform="translate(260, 190)">
    <!-- Techo -->
    <polygon points="0,0 50,-25 100,0 50,25" class="roof-2"/>
    <!-- Pared izquierda -->
    <polygon points="0,0 50,25 50,60 0,35" class="building-3"/>
    <!-- Pared derecha -->
    <polygon points="100,0 50,25 50,60 100,35" class="building-1"/>
    <!-- Pared frente -->
    <polygon points="0,35 50,60 100,35 100,10 0,10" class="building-2"/>
    <!-- Ventanas -->
    <rect x="25" y="18" width="6" height="6" class="window"/>
    <rect x="69" y="18" width="6" height="6" class="window"/>
    <rect x="25" y="32" width="6" height="6" class="window"/>
    <rect x="69" y="32" width="6" height="6" class="window"/>
  </g>

  <!-- Detalle: pequeñas sombras entre edificios -->
  <ellipse cx="120" cy="210" rx="40" ry="10" fill="#000000" opacity="0.08"/>
  <ellipse cx="240" cy="190" rx="45" ry="12" fill="#000000" opacity="0.08"/>
  <ellipse cx="380" cy="220" rx="35" ry="8" fill="#000000" opacity="0.08"/>

  <!-- Título en la esquina inferior -->
  <text x="250" y="330" class="text-label">Contribution City</text>
  <text x="250" y="343" class="text-sub">Antony Samuel Figueroa Montero · Desarrollador de Software</text>
</svg>